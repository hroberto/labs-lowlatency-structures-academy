<text x="24.0" y="34.0" fill="#0b0b0b" font-size="17" font-weight="600" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Dispersão entre execuções da campanha</text>
<text x="24.0" y="54.0" fill="#52514e" font-size="12" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">piso por operação, em 5 execuções do mesmo experimento — mesma máquina, nada mudou entre elas</text>
