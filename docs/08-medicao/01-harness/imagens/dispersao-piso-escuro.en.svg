<text x="24.0" y="502.0" fill="#c3c2b7" font-size="11" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">The percentiles come out identical across runs. The maximum is ONE</text>
<text x="24.0" y="516.0" fill="#c3c2b7" font-size="11" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">sample, and it jumps depending on whether that run caught an interrupt.</text>
