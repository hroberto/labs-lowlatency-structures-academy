<svg xmlns="http://www.w3.org/2000/svg" width="760" height="530" viewBox="0 0 760 530" role="img" aria-labelledby="titulo descricao">
<title id="titulo">Spread across the campaign's runs</title>
<desc id="descricao">Four panels, one per metric, each with the values of the campaign's 5 runs. The p50, p99 and p99.9 panels show identical values across runs; the maximum panel shows two values far above the others.</desc>
<rect width="760" height="530" fill="#1a1a19"/>
<text x="24.0" y="34.0" fill="#ffffff" font-size="17" font-weight="600" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Spread across the campaign's runs</text>
<text x="24.0" y="54.0" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">per-operation floor, across 5 runs of the same experiment — same machine, nothing changed</text>
<text x="136.0" y="128.0" fill="#ffffff" font-size="13" font-weight="600" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">p50</text>
<text x="136.0" y="145.0" fill="#c3c2b7" font-size="11" font-weight="400" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-variant-numeric="tabular-nums">spread 0.0%</text>
