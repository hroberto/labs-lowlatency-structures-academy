<svg xmlns="http://www.w3.org/2000/svg" width="760" height="530" viewBox="0 0 760 530" role="img" aria-labelledby="titulo descricao">
<title id="titulo">Dispersão entre execuções da campanha</title>
<desc id="descricao">Quatro painéis, um por métrica, cada um com os valores das 5 execuções da campanha. Os painéis de p50, p99 e p99,9 mostram valores idênticos entre execuções; o painel do máximo mostra dois valores muito acima dos demais.</desc>
